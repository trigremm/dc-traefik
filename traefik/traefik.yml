global:
  checkNewVersion: true
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: traefik-public
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # email is set via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL in .env
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

api:
  dashboard: true
  insecure: false

ping: {}

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - '400-599'
    retryAttempts: true
    minDuration: '10ms'
